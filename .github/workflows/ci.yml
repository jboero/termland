name: CI

# Runs on the target distro rather than ubuntu-latest so the dependency list
# below can be the same one the RPMs already build against
# (packaging/*.spec BuildRequires), instead of a hand-translated Debian
# equivalent that drifts from what actually ships.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Fail the build on warnings in our own crates. Vendored dependencies are
  # not built with this.
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    container: fedora:43

    steps:
      - name: Install build dependencies
        # Kept in sync with BuildRequires in packaging/termland-server.spec and
        # packaging/termland-client.spec — this is the union of the two, plus
        # git, which the checkout action needs inside a container.
        #
        # chromium and python3 are test-only, not BuildRequires: web/test-browser.sh
        # drives a real browser and serves the page with `python3 -m http.server`.
        # python3 is not implicit — the Fedora base image dropped it when dnf5
        # replaced the Python-based dnf.
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git \
            rust cargo \
            rust-std-static-wasm32-unknown-unknown \
            clang-devel \
            cmake gcc gcc-c++ \
            perl \
            ffmpeg-free-devel \
            opus-devel \
            pulseaudio-libs-devel \
            alsa-lib-devel \
            pam-devel \
            wayland-devel wayland-protocols-devel \
            chromium python3

      - uses: actions/checkout@v4

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        # ~/.cargo/bin holds wasm-bindgen-cli. Without it in the cache,
        # `cargo install` rebuilds that CLI from source on every single run.
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-fedora43-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-fedora43-cargo-

      - name: Show toolchain
        run: cargo --version && rustc --version

      - name: Build workspace
        run: cargo build --workspace --locked

      # Unit tests only in this job; the integration job below runs the rest.
      - name: Run unit tests
        run: cargo test --workspace --locked --lib --bins

      # Decodes wire bytes captured from every released version. Runs here
      # rather than in the integration job because it needs no compositor —
      # and a protocol break should fail fast, on every PR, not behind a
      # ten-minute container build.
      - name: Cross-version wire compatibility
        run: cargo test --workspace --locked --test wire_compatibility

      # A browser client runs termland-protocol as wasm rather than
      # reimplementing the framing in another language (see #20). This is a
      # one-line `cargo build` that keeps the crate free of host-only deps
      # (tokio's default features pull in mio, which is how it started out).
      - name: Check termland-protocol still builds for wasm32
        run: cargo build -p termland-protocol --locked --target wasm32-unknown-unknown

      # Canonical CBOR fixtures. The wasm codec must emit these same bytes
      # (web/tests/fixtures.test.ts). No compositor.
      - name: Canonical protocol fixtures
        run: cargo test --workspace --locked --test web_cross_language

      # TypeScript client + wasm protocol: framing, Q2 headers, and the
      # fixture byte-compare. Node and wasm-bindgen-cli are not otherwise
      # build dependencies of this repo.
      - name: TypeScript client and wasm protocol tests
        run: |
          dnf install -y --setopt=install_weak_deps=False nodejs npm
          # The bindgen schema is not stable across releases, so the CLI must
          # match the generated glue exactly. Read the version from the
          # lockfile rather than hardcoding it here, so bumping the crate
          # cannot leave CI installing a stale CLI (or vice versa).
          wb_version() {
            awk '/^name = "wasm-bindgen"$/ { getline; gsub(/[",]/, "", $3); print $3; exit }' "$1"
          }
          WB=$(wb_version crates/termland-web/Cargo.lock)
          # Both wasm crates are built by the one CLI installed here, so their
          # lockfiles have to agree. If they drift, one of the two builds fails
          # on a bindgen schema mismatch that says nothing about lockfiles.
          WB_CLIENT=$(wb_version crates/termland-web-client/Cargo.lock)
          if [ "$WB" != "$WB_CLIENT" ]; then
            echo "wasm-bindgen pins disagree: termland-web ${WB}, termland-web-client ${WB_CLIENT}" >&2
            echo "Bring them together with 'cargo update -p wasm-bindgen --precise <version>'." >&2
            exit 1
          fi
          echo "wasm-bindgen pinned at ${WB}"
          cargo install wasm-bindgen-cli --version "$WB"
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo test --manifest-path crates/termland-web/Cargo.toml --lib
          ./web/build.sh

      # The only test that proves a *browser* interoperates. Everything else
      # in the WebTransport suite drives the listener with a `wtransport`
      # client, which cannot catch a WebCodecs config the browser rejects,
      # broken wasm-bindgen glue, or a serverCertificateHashes regression.
      #
      # It lives in this job rather than `integration` because it only drives
      # the handshake -- no session is created, so no compositor is needed --
      # and this job has already built target/debug/termland-server, web/pkg/
      # and web/dist/ in the step above.
      - name: Browser interop (real Chromium)
        run: ./web/test-browser.sh

      # The Rust/wasm client (crates/termland-web-client), a parallel
      # implementation to web/src. Its unit tests run on the host; the crate
      # itself only builds for wasm32.
      #
      # `cd` into the crate is required, not stylistic: WebTransport and
      # WebCodecs need --cfg=web_sys_unstable_apis, which the crate declares in
      # its own .cargo/config.toml, and cargo finds that file relative to the
      # working directory rather than --manifest-path.
      - name: Rust browser client tests
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          (cd crates/termland-web-client && cargo test --lib)
          ./web/build-wasm.sh

      # Same argument as the TypeScript browser check above: a wtransport
      # client cannot exercise wasm-bindgen glue or WebCodecs. Handshake only —
      # `--with-video` needs a compositor and is left for the developer.
      - name: Rust client browser interop (real Chromium)
        run: ./web/test-browser-wasm.sh

      - name: Check the RPM specs still parse
        run: |
          dnf install -y --setopt=install_weak_deps=False rpm-build
          rpmspec -P packaging/termland-server.spec > /dev/null
          rpmspec -P packaging/termland-client.spec > /dev/null

  integration:
    name: Integration tests (real compositor)
    runs-on: ubuntu-latest
    container: fedora:44
    # Not gated on `test`: a compositor failure and a unit-test failure are
    # different signals and it is useful to see both from one push.

    steps:
      - name: Install build and runtime dependencies
        # Beyond the build set, this needs an actual Wayland stack:
        #
        #   labwc          the compositor a Desktop session runs
        #   Xwayland       labwc is built with +xwayland and refuses to start
        #                  without it, even when nothing X11 is involved
        #   foot           a terminal for the session to open a window with;
        #                  chosen for being small, and it is first in the
        #                  server's own detection order after konsole
        #   mesa-dri       llvmpipe, so wlroots can render with no GPU
        #   pulseaudio     the session audio path loads a null sink through it
        #   dejavu mono    a monospace font. Not optional: with no monospace
        #                  font foot fails to map a window, its exit takes
        #                  labwc down with it, and every compositor test dies
        #                  on a broken pipe that says nothing about fonts
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git \
            rust cargo \
            clang-devel \
            cmake gcc gcc-c++ \
            perl \
            ffmpeg-free-devel ffmpeg-free \
            opus-devel opus \
            pulseaudio-libs-devel pulseaudio-libs pulseaudio pulseaudio-utils \
            alsa-lib-devel \
            pam-devel \
            wayland-devel wayland-protocols-devel \
            labwc foot xorg-x11-server-Xwayland mesa-dri-drivers \
            dejavu-sans-mono-fonts

      - uses: actions/checkout@v4

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-fedora44-integration-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-fedora44-integration-

      - name: Start a headless session environment
        run: |
          # XDG_RUNTIME_DIR must exist and be 0700 or the Wayland socket is
          # refused. A container has no logind to create it.
          echo "XDG_RUNTIME_DIR=/tmp/xdg" >> "$GITHUB_ENV"
          mkdir -p /tmp/xdg && chmod 700 /tmp/xdg

          # wlroots' headless backend needs no GPU or seat; pixman keeps
          # rendering entirely in software so llvmpipe is not even required to
          # be fast, only present.
          echo "WLR_BACKENDS=headless"      >> "$GITHUB_ENV"
          echo "WLR_RENDERER=pixman"        >> "$GITHUB_ENV"
          echo "WLR_HEADLESS_OUTPUTS=1"     >> "$GITHUB_ENV"

      - name: Start PulseAudio
        # exit-idle-time=-1 stops it exiting between tests. Not fatal if it
        # fails: the audio plane degrades to "not independently verified" and
        # the tests still assert everything else.
        run: |
          export XDG_RUNTIME_DIR=/tmp/xdg
          pulseaudio --start --exit-idle-time=-1 --daemonize=yes || true
          sleep 1
          pactl info | head -3 || echo "PulseAudio unavailable — audio plane will be skipped"

      # --include-ignored also runs the tests that need a live compositor,
      # which is the entire point of this job.
      - name: Run integration tests
        run: cargo test --workspace --locked --test '*' -- --include-ignored --test-threads=1

      # A leaked session on a throwaway runner is harmless, but a non-empty
      # list here means teardown regressed — which on a developer's own
      # machine strands a desktop session that nothing will ever reap.
      - name: Assert no sessions were leaked
        if: always()
        run: |
          export XDG_RUNTIME_DIR=/tmp/xdg
          left=$(ls /tmp/xdg/termland/sessions/*.session 2>/dev/null | wc -l)
          echo "sessions left behind: $left"
          test "$left" -eq 0
