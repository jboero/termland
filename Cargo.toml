[workspace]
members = [
    "crates/termland-protocol",
    "crates/termland-codec",
    "crates/termland-compositor",
    "crates/termland-server",
    "crates/termland-client",
    "crates/termland-mobile-core",
]
resolver = "2"

[workspace.package]
version = "0.6.1"
edition = "2024"
license = "LGPL-3.0-or-later"
rust-version = "1.85"

[workspace.dependencies]
# Internal crates
termland-protocol = { path = "crates/termland-protocol" }
termland-codec = { path = "crates/termland-codec" }
termland-compositor = { path = "crates/termland-compositor" }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }

# Serialization
serde = { version = "1", features = ["derive"] }
ciborium = "0.2"

# Utilities
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
rustls = "0.23"
tokio-rustls = "0.26"
rcgen = "0.13"
rustls-pemfile = "2"
libc = "0.2"
bytemuck = { version = "1", features = ["derive"] }
whoami = "1"
rustls-native-certs = "0.8"
opus = "0.3"
cpal = "0.15"
libpulse-binding = "2"
libpulse-simple-binding = "2"
uniffi = "0.29"

# QUIC (Q1: drop-in single-stream byte transport, see docs/quic-transport.md).
# Pure-Rust, tokio-based, wraps rustls 0.23 - matches the TLS stack already
# used by the TCP+TLS path. Each crate pins the rustls crypto backend that
# matches its existing choice (see the per-crate Cargo.toml comments) rather
# than pulling in quinn's default feature set, to avoid ambiguous
# process-level CryptoProvider selection when the workspace is built together.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
