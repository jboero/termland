org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# The distro default JDK here is 25, which AGP 8.7 rejects. Pin Gradle's JVM to 21,
# the newest LTS AGP 8.7.x officially supports. /usr/lib/jvm/java-21-openjdk is an
# empty leftover on this box, so we use Android Studio's bundled JBR 21 instead.
#
# MACHINE-SPECIFIC: this is the one absolute path in the build. Point it at any
# JDK 17 or 21 you have, or delete the line and run with JAVA_HOME set to one.
org.gradle.java.home=/home/jboero/android-studio/jbr

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# --- Termland native core wiring -------------------------------------------
# Path to the Cargo workspace root, relative to android/ (see app/build.gradle.kts).
termland.rustRoot=..
# Cargo package that carries the UniFFI-exported API.
termland.rustPackage=termland-mobile-core
# Build the Rust core in release mode even for debug APKs: a debug-profile video
# path is far too slow to be useful, and the core is not what we debug from Kotlin.
termland.rustRelease=true
# ABIs to cross-compile. arm64-v8a is the real target (tablets), x86_64 is for the
# emulator. Add armeabi-v7a here if you still care about 32-bit devices.
termland.abis=arm64-v8a,x86_64
