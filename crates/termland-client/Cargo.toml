[package]
name = "termland-client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
termland-protocol = { workspace = true }
termland-codec = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
winit = "0.30"
softbuffer = "0.4"
futures = "0.3"
font8x8 = { version = "0.3", default-features = false, features = ["unicode"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-backend = { version = "0.3", features = ["client_system"] }
raw-window-handle = "0.6"
cpal = { workspace = true }
opus = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pemfile = { workspace = true }
rustls-native-certs = { workspace = true }
whoami = { workspace = true }
ksni = "0.3"  # pure-Rust (zbus) StatusNotifierItem; no system dbus-devel needed
serde = { workspace = true }
serde_json = "1"  # profiles.json persistence for --manager
# GUI toolkit for --manager (profile list + resumable-session window).
# Pure Rust, no C++ toolchain — cxx-qt/Qt6 (the ROADMAP's original plan) was
# tried and fails to link against this environment's Qt 6.11.1; egui avoids
# that build burden entirely, same rationale as tray.rs's zbus-over-cxx-qt choice.
eframe = { version = "0.29", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
egui = "0.29"
