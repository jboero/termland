[package]
name = "termland-codec"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
termland-protocol = { path = "../termland-protocol" }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# v9 tracks FFmpeg 9 (Homebrew's current release on macOS). Keep the codec
# layer on the matching binding generation so native clients do not rely on a
# Linux-only system FFmpeg version.
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format", "software-scaling"] }
libc = "0.2"
opus = { workspace = true }

[[bin]]
name = "av1_test"
path = "src/bin/av1_test.rs"
