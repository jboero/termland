[package]
name = "termland-mobile-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Termland protocol/transport core for mobile clients, exposed via UniFFI"

[lib]
name = "termland_mobile_core"
# cdylib for the Android/iOS loader, lib so the bindgen binary and tests can
# link the same crate.
crate-type = ["cdylib", "lib"]

[dependencies]
termland-protocol = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = "0.3"
tracing = { workspace = true }
thiserror = { workspace = true }
uniffi = { workspace = true, features = ["cli"] }

# `ring` rather than the default aws-lc-rs: it cross-compiles to the Android and
# iOS targets without cmake/nasm on the build host. The provider is passed
# explicitly to ClientConfig so feature unification inside the workspace (the
# desktop client pulls in aws-lc-rs) can never change which one we use.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = { workspace = true }

# Pure-Rust SSH client for the embedded `Transport::Ssh` variant (mobile
# sandboxes can't spawn the `ssh` binary the desktop client uses). Same
# reasoning as the rustls block above: `ring` instead of the default
# `aws-lc-rs` so nothing in this crate's own dependency graph needs
# cmake/nasm/a C compiler on the NDK cross-compile host. `rsa` is kept for
# host-key algorithm coverage even though this crate only ever does password
# auth today; `russh` as of 0.62 folds key handling into `russh::keys`
# directly, so there is no separate `russh-keys` crate to add.
russh = { version = "0.62.5", default-features = false, features = ["ring", "flate2", "rsa"] }

[dev-dependencies]
bytes = { workspace = true }

[[bin]]
# `cargo run --bin uniffi-bindgen -- generate --library <.so> --language kotlin`
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
