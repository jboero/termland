[package]
name = "termland-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
termland-protocol = { workspace = true }
termland-codec = { workspace = true }
termland-compositor = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
futures = "0.3"
libpulse-binding = { workspace = true }
libpulse-simple-binding = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rcgen = { workspace = true }
rustls-pemfile = { workspace = true }
libc = { workspace = true }
bytemuck = { workspace = true }
bytes = { workspace = true }
# aws-lc-rs to match the explicit provider tls.rs/quic.rs select (workspace's
# `rustls` default features already bring aws-lc-rs in for this crate).
quinn = { workspace = true, features = ["rustls-aws-lc-rs"] }
# WebTransport (HTTP/3) listener for browser clients — see webtransport.rs.
# Resolves against the same quinn 0.11 / rustls 0.23 the rest of the crate
# already uses, so this adds a protocol, not a second QUIC stack.
wtransport = "0.7"

[dev-dependencies]
# The WebTransport test drives the listener as a real client.
# dangerous-configuration is dev-only: it enables skipping validation of the
# server's short-lived self-signed development certificate, which a browser
# would instead pin via serverCertificateHashes. It is deliberately not in the
# main dependency so it cannot reach a shipped binary.
wtransport = { version = "0.7", features = ["dangerous-configuration"] }
