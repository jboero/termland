<!doctype html>
<meta charset="utf-8">
<title>Termland</title>
<style>
  :root { color-scheme: dark; }
  body { font: 14px/1.45 system-ui, sans-serif; margin: 0; background: #11111b; color: #cdd6f4; }
  header { padding: .75rem 1rem; background: #181825; border-bottom: 1px solid #313244; }
  h1 { font-size: 1rem; margin: 0 0 .5rem; color: #89b4fa; }
  .row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: end; }
  label { display: flex; flex-direction: column; font-size: 12px; color: #a6adc8; }
  input { background: #11111b; color: #cdd6f4; border: 1px solid #313244; border-radius: 4px;
          padding: .35rem .5rem; font-family: ui-monospace, monospace; min-width: 12rem;
          height: 2rem; box-sizing: border-box; }
  #url { width: 22rem; }
  #hash { width: 36rem; }
  button { background: #89b4fa; color: #11111b; border: 0; border-radius: 4px; padding: .4rem .8rem;
           font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.ghost { background: #313244; color: #cdd6f4; }
  #stage { position: relative; display: grid; place-items: center; min-height: calc(100vh - 14rem);
           background: #000; }
  canvas { max-width: 100%; max-height: calc(100vh - 14rem); background: #000; outline: none; }
  #banner { position: absolute; top: 1rem; background: #f9e2af; color: #11111b; padding: .4rem .8rem;
            border-radius: 4px; font-weight: 600; }
  #out, #sessions { padding: .5rem 1rem; font-size: 12px; }
  #out { background: #181825; border-bottom: 1px solid #313244; }
  pre { margin: 0; white-space: pre-wrap; }
  .session { margin: .25rem 0; }
  .note { color: #a6adc8; }
</style>
<header>
  <h1>Termland — browser client</h1>
  <div class="row">
    <label>Server URL<input id="url" value="https://127.0.0.1:7868/termland"></label>
    <label>Certificate SHA-256<input id="hash" placeholder="from the server log, or empty if trusted"></label>
    <label>Username<input id="user" autocomplete="username"></label>
    <label>Password<input id="pass" type="password" autocomplete="current-password"></label>
    <button id="connect">Connect</button>
    <button id="new-session" class="ghost" disabled>New session</button>
    <button id="pointer-lock" class="ghost">Pointer lock</button>
  </div>
  <p class="note">Experimental. Origin must be listed in <code>--webtransport-origin</code>.
    Click the canvas for keyboard; pointer lock for relative mouse.</p>
  <pre id="out">Not connected.</pre>
</header>
<div id="sessions"></div>
<div id="stage">
  <div id="banner" hidden></div>
  <canvas id="screen" tabindex="0" width="1280" height="720"></canvas>
</div>
<script type="module" src="./dist/main.js"></script>
